global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
  - job_name: "backend-service"
    metrics_path: "/aye-backend-service/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8443"
  - job_name: "web-service"
    metrics_path: "/aye-web-service/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:6001"