<!DOCTYPE html>
<html data-layout-decorate="~{fragments/layout}" lang="en">
<head>
    <link rel="stylesheet" th:href="@{/css/steps-trans.css}">
    <title>Step Transaction History</title>
</head>


<body>
<div class="right_col" data-layout-fragment="content" role="main">
    <div class="row">
        <div class="col-sm-12">
            <div class="panel panel-default">
                <input class="form-control"
                       id="orgId"
                       th:value="${orgId}"
                       type="hidden">
                <input class="form-control"
                       id="invOrgId"
                       th:value="${invOrgId}"
                       type="hidden">
                <input class="form-control" id="templateid" placeholder="Template Id" readonly
                       th:value="${tempDtlId}" type="hidden"/>
                <!-- Default panel contents -->
                <div class="panel-heading">Step Transaction History</div>
                <div class="panel-body">
                    <form method="post"
                          th:action="@{'/step-trans/history-search' + '/' + ${pageId} + '/' + ${tempDtlId}+ '/' + ${invOrgId}+ '/' + ${orgId}}"
                          th:object="${stepTransFilter}">

                        <div class="form-group">
                            <!-- Search -->
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label" for="search">Search</label>
                                <div class="col-sm-1 text-center">:</div>
                                <div class="col-sm-3">
                                    <input class="form-control" id="search" placeholder="search"
                                           th:field="*{searchKeyword}" type="text"/>
                                    <p class="text-danger" th:errors="*{searchKeyword}"></p>
                                </div>
                            </div>

                            <!-- Transport Name -->
                            <div class="form-group row">
                                <label class="col-sm-2 col-form-label" for="search">Status</label>
                                <div class="col-sm-1 text-center">:</div>
                                <div class="col-sm-3">
                                    <select class="form-control" id="stepTransStatus"
                                            required
                                            th:field="*{stepTransStatus}">
                                        <option value="">-- Select --</option>
                                        <option th:each="t : ${T(com.aye.enums.StepTransStatus).values()}"
                                                th:text="${t.displayName}" th:value="${t}">
                                        </option>
                                    </select>
                                </div>
                            </div>


                            <!-- Date Row -->
                            <div class="form-group row">
                                <!-- From Date -->
                                <label class="col-sm-2 col-form-label" for="fromDate">From Date</label>
                                <div class="col-sm-1 text-center">:</div>
                                <div class="col-sm-3">
                                    <input class="form-control" id="fromDate"
                                           required th:field="*{fromDate}" type="date"/>
                                    <p class="text-danger" th:errors="*{fromDate}"></p>
                                </div>
                            </div>

                            <div class="form-group row">
                                <!-- To Date -->
                                <label class="col-sm-2 col-form-label" for="toDate">To Date</label>
                                <div class="col-sm-1 text-center">:</div>
                                <div class="col-sm-3">
                                    <input class="form-control" id="toDate"
                                           th:field="*{toDate}" type="date"/>
                                    <p class="text-danger" th:errors="*{toDate}"></p>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="form-group row">
                                <div class="col-sm-12 text-left">
                                    <button class="btn btn-primary" type="submit">Search</button>
                                    <a class="btn btn-dark"
                                       th:href="@{'/step-trans/history/' + ${pageId} + '/' + ${tempDtlId}+ '/' + ${invOrgId}+ '/' + ${orgId}}">
                                        Reset
                                    </a>
                                    <a class="btn btn-default"
                                       th:href="@{'/step-trans/list/' + ${pageId} + '/' + ${tempDtlId}+ '/' + ${invOrgId}+ '/' + ${orgId}}">
                                        Back
                                    </a>
                                </div>
                            </div>
                        </div>

                    </form>
                    <div class="row">
                        <div class="form-group col-sm-12">
                            <table class="table table-hover table-bordered custom-gray-table text-dark text-center">
                                <thead>
                                <tr>

                                    <th style="width: 50px;"></th>
                                    <th style="width: 50px;">SL#</th>
                                    <th>TransNo</th>
                                    <th>Entry Date</th>
                                    <th>VehicleNo</th>
                                    <th>Driver Phone</th>
                                    <th>Additional Info</th>
                                    <th>Weight</th>
                                    <th>Status</th>
                                </tr>
                                </thead>

                                <tbody>
                                <th:block th:each="line, iterStat : ${stepTransList}">

                                    <!-- Main row -->
                                    <tr>

                                        <td>
                                            <button class="btn btn-default btn-xs" data-toggle="collapse"
                                                    th:attr="data-target='#collapse-' + ${iterStat.index}, aria-expanded='false', aria-controls='collapse-' + ${iterStat.index}"
                                                    type="button">
                                                <span aria-hidden="true" class="glyphicon glyphicon-plus"></span>
                                            </button>
                                        </td>
                                        <td th:text="${iterStat.index +1}"></td>
                                        <td th:text="${line.stepTransNo}"></td>
                                        <td th:text="${#temporals.format(line.createdAt, 'dd-MMM-yyyy hh:mm a')}"></td>
                                        <td th:text="${line.vehicleNumber}"></td>
                                        <td th:text="${line.driverPhoneNo}"></td>
                                        <td>
                                            <div class="table-responsive" style="margin:0;">
                                                <table class="table table-condensed table-bordered"
                                                       style="margin-bottom:0;">
                                                    <tbody>
                                                    <tr th:each="dtl : ${line.stepTransDetails}">
                                                        <td style="width:40%; font-weight:normal;">
                                                            <span th:text="${dtl.custName}"></span>
                                                        </td>
                                                        <td style="width:40%; padding:0;">
                                                            <table class="table table-condensed"
                                                                   style="margin-bottom:0;">
                                                                <tbody>
                                                                <tr th:each="ln : ${dtl.stepTransDetailsLines}">
                                                                    <td style="border-top:none;">
                                                                        <span class="text-muted"></span>
                                                                        <span th:text="${ln.orderedItem + ' (' + ln.orderedQuantity + ')'}"></span>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </td>
                                        <td class="text-center" th:text="${line.stepWiseWeight}"></td>
                                        <td class="text-center" th:text="${line.stepTransStatus}"></td>

                                    </tr>

                                    <!-- Detail row, immediately below its own main row -->
                                    <tr>
                                        <td colspan="9" style="padding: 0; border-top: none;">
                                            <div class="collapse" th:id="'collapse-' + ${iterStat.index}">
                                                <div class="well" style="margin: 10px;">
                                                    <h4>Step Transaction Lines for: <strong
                                                            th:text="${line.stepTransNo}"></strong></h4>
                                                    <table class="table table-bordered table-striped table-hover">
                                                        <thead>
                                                        <tr class="active">
                                                            <th>Line No</th>
                                                            <th>Step Name</th>
                                                            <th>Last UpdatedAt</th>
                                                            <th>Step Status</th>
                                                            <th>Remarks</th>
                                                        </tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr th:if="${line.stepTransLinesResponseList == null or line.stepTransLinesResponseList.isEmpty()}">
                                                            <td class="text-center text-muted" colspan="12">
                                                                <em>No step transaction lines found</em>
                                                            </td>
                                                        </tr>
                                                        <tr th:each="transLine : ${line.stepTransLinesResponseList}">
                                                            <td th:text="${transLine.stepTransLinesNo}"></td>
                                                            <td th:text="${transLine.stepName}"></td>
                                                            <td th:text="${#temporals.format(transLine.updatedAt, 'dd-MMM-yyyy hh:mm a')}"></td>
                                                            <!--                                                            <td th:text="${transLine.updatedAt}"></td>-->
                                                            <td th:text="${transLine.stepStatus}"></td>
                                                            <td th:text="${transLine.remarks}"></td>
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>

                                </th:block>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="panel-footer"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
